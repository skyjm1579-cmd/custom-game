<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선인장 게임 (Cactus Card Game)</title>
  <style>
    :root {
      --bg: #142419;
      --panel: #1f3626;
      --panel-2: #284531;
      --accent: #68d391;
      --accent-2: #f6ad55;
      --danger: #fc8181;
      --text: #f7fafc;
      --muted: #cbd5e0;
      --card-bg: #fffdf7;
      --card-dark: #1a202c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1f3b28, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(20, 36, 25, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    .badge {
      display: inline-block;
      background: var(--panel-2);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 8px;
    }
    .lobby, .game {
      background: rgba(31, 54, 38, 0.88);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .box {
      background: var(--panel-2);
      border-radius: 12px;
      padding: 16px;
    }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #132418;
      color: var(--text);
      margin-bottom: 12px;
    }
    button {
      padding: 10px 16px;
      background: var(--accent);
      color: #0f2416;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #3b5e46; color: var(--text); }
    button.warn { background: var(--accent-2); color: #1a202c; }
    button.danger { background: var(--danger); color: #1a202c; }

    .players-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .p-card {
      background: var(--panel-2);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px;
    }
    .p-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(104, 211, 145, 0.25);
    }
    .p-name { font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .p-score { font-size: 1.25rem; font-weight: 800; color: var(--accent-2); margin-top: 4px; }
    .p-meta { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }

    .table-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }
    @media (max-width: 720px) { .table-area { grid-template-columns: 1fr; } }
    .pile-box {
      background: var(--panel-2);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      text-align: center;
    }
    .card-visual {
      width: 120px;
      height: 168px;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      user-select: none;
    }
    .card-face {
      background: var(--card-bg);
      color: #1a202c;
      border: 2px solid #2d3748;
    }
    .card-back {
      background: linear-gradient(135deg, #276749, #1c4532);
      color: #e6fffa;
      border: 2px solid #9ae6b4;
      align-items: center;
      justify-content: center;
    }
    .card-score {
      background: var(--card-dark);
      color: #fefcbf;
      border: 2px solid #f6e05e;
    }
    .hand-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .hand-card {
      width: 128px;
      min-height: 176px;
      border-radius: 12px;
      padding: 10px;
      background: var(--card-bg);
      color: #1a202c;
      border: 2px solid #2d3748;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
    }
    .hand-card.selected {
      outline: 3px solid var(--accent-2);
      transform: translateY(-4px);
    }
    .card-title { font-size: 0.98rem; font-weight: 800; }
    .card-type { font-size: 0.75rem; color: #4a5568; }
    .card-desc { font-size: 0.76rem; line-height: 1.3; color: #2d3748; margin-top: 6px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
    .log {
      background: #101d14;
      border-radius: 10px;
      padding: 12px;
      max-height: 170px;
      overflow-y: auto;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #e2e8f0;
    }
    .hidden { display: none; }
    .room-code-box {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🌵 선인장 게임 <span class="badge">2~6인 캐릭터·행동 카드 룰</span></h1>
      </div>
      <div id="roomInfo" class="hidden">
        방 코드: <span id="displayRoomCode" class="room-code-box"></span>
        <button class="secondary" onclick="copyRoomCode()" style="margin-left:8px; padding:6px 12px;">코드 복사</button>
        <button class="secondary" onclick="leaveGame()" style="margin-left:6px; padding:6px 12px;">로비로</button>
      </div>
    </header>

    <section id="lobby" class="lobby">
      <div class="grid-2">
        <div class="box">
          <h2>새 게임 방 만들기</h2>
          <label for="hostName">내 닉네임</label>
          <input id="hostName" type="text" value="플레이어 1" maxlength="12" />

          <label for="playerCount">총 인원 수 (2~6명)</label>
          <select id="playerCount">
            <option value="2">2명 (승리 목표: 7점)</option>
            <option value="3">3명 (승리 목표: 7점)</option>
            <option value="4" selected>4명 (승리 목표: 5점)</option>
            <option value="5">5명 (승리 목표: 5점)</option>
            <option value="6">6명 (승리 목표: 4점)</option>
          </select>

          <label for="aiCount">AI 봇 수 (남은 자리는 대기/봇으로 채움)</label>
          <select id="aiCount">
            <option value="0">0명 (친구/다른 탭 초대)</option>
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3" selected>3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
          </select>

          <button onclick="createRoom()">방 만들고 시작하기</button>
        </div>

        <div class="box">
          <h2>방 코드로 참가하기</h2>
          <label for="joinName">내 닉네임</label>
          <input id="joinName" type="text" value="친구" maxlength="12" />

          <label for="joinCode">6자리 방 코드</label>
          <input id="joinCode" type="text" placeholder="예: KAKTUS" maxlength="6" style="text-transform:uppercase;" />

          <button class="secondary" onclick="joinRoom()">방 참가하기</button>

          <hr style="border-color: rgba(255,255,255,0.1); margin: 18px 0;" />
          <h3>승리 목표 점수 안내</h3>
          <p style="font-size:0.88rem; color:var(--muted); margin:0; line-height:1.5;">
            • 2~3명: <strong>7점</strong> 선취 시 즉시 승리<br/>
            • 4~5명: <strong>5점</strong> 선취 시 즉시 승리<br/>
            • 6명: <strong>4점</strong> 선취 시 즉시 승리<br/>
            • 점수 카드를 1장 이상 얻거나 카드를 1장 이상 뽑으면 즉시 차례가 종료됩니다.
          </p>
        </div>
      </div>
    </section>

    <section id="game" class="game hidden">
      <div id="playersBar" class="players-bar"></div>

      <div class="table-area">
        <div class="pile-box">
          <div class="card-visual card-back" onclick="handleDrawPileClick()" style="cursor:pointer;">
            <div>🌵</div>
            <div style="font-size:0.85rem;">카드 더미</div>
            <div id="deckCount" style="font-size:0.8rem;">0장</div>
          </div>
          <p style="font-size:0.82rem; color:var(--muted); margin:10px 0 0;">
            차례에 1장 뽑기 (손패 0장 시작 시 3장 뽑기)
          </p>
        </div>

        <div class="pile-box">
          <div id="discardVisual" class="card-visual card-face">
            <div style="font-size:0.8rem; color:#718096;">버린 카드</div>
            <div id="discardTopTitle" style="font-size:1rem;">비어 있음</div>
            <div id="discardCount" style="font-size:0.78rem; color:#4a5568;">0장</div>
          </div>
          <p id="pendingActionHint" style="font-size:0.84rem; color:var(--accent-2); margin:10px 0 0;">
            대기 중인 행동 없음
          </p>
        </div>
      </div>

      <div id="targetPanel" class="box hidden" style="margin-bottom:14px;">
        <strong id="targetPrompt">대상 선택</strong>
        <div id="targetButtons" class="controls" style="margin-bottom:0;"></div>
      </div>

      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <h3 style="margin:0;">내 손패 (<span id="myHandCount">0</span>장)</h3>
          <div class="controls" style="margin:0;">
            <button onclick="playSelectedCards()">선택 카드 내기</button>
            <button class="secondary" onclick="drawFromDeckAction()">카드 뽑기</button>
            <button class="danger" onclick="playStopCard()">🛑 정지(STOP) 사용</button>
            <button class="warn" onclick="endTurnManual()">차례 넘기기</button>
          </div>
        </div>
        <div id="myHand" class="hand-grid"></div>
      </div>

      <div style="margin-top:16px;">
        <h3 style="margin:0 0 8px;">진행 로그</h3>
        <div id="gameLog" class="log"></div>
      </div>
    </section>
  </div>

  <script>
    const CARD_DEFS = {
      charlie: { name: '찰리', kind: 'character', points: 1, desc: '같은 카드 3장 내면 점수 카드 1장 획득(차례 종료)' },
      spike: { name: '스파이크', kind: 'character', points: 2, desc: '같은 카드 3장 내면 점수 카드 2장 획득(차례 종료)' },
      walter: { name: '월터', kind: 'character', points: 3, desc: '같은 카드 3장 내면 점수 카드 3장 획득(차례 종료)' },
